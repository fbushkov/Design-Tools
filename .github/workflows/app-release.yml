# Сборка установщика Design Tools для Windows и выпуск на GitHub.
# Запуск: метка вида v0.3.1 (git tag v0.3.1 && git push origin v0.3.1)
# или вручную во вкладке Actions. Установленные программы подхватят выпуск сами.
name: Выпуск приложения

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Выпуск создаётся заранее черновиком: иначе electron-builder при параллельной
      # загрузке файлов создаёт два выпуска с одной меткой, и автообновление ломается.
      - name: Метка и черновик выпуска
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="$(node -p "require('./package.json').version")"
          TAG="v$V"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$V" --notes "Design Tools $V"
          fi
      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Опубликовать выпуск
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name'
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx latest.yml
          gh release edit "$TAG" --draft=false --latest
